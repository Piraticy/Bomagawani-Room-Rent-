name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Start app and run smoke checks
        run: |
          cp .env.example .env
          npm start &
          APP_PID=$!
          sleep 5
          curl -f http://localhost:3000/healthz
          curl -f http://localhost:3000/api/public/bootstrap
          kill $APP_PID
